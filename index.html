<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Domino Counter</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="app">

        <div class="logo">
            <img src="icons/domino-logo.svg"
                 alt="Domino Counter">
        </div>

        <h1>Domino Counter</h1>

        <p class="subtitle">
            Scan a player's remaining dominoes.
        </p>

        <button id="scanButton">
            Scan Dominoes
        </button>

        <button id="captureButton" style="display:none;">
            Capture
        </button>

        <canvas id="snapshot" style="display:none;"></canvas>

        <p id="status"></p>

        <footer>
            Version 0.4.0
        </footer>

    </main>

    <script type="module" src="js/app.js"></script>

</body>

</html>
